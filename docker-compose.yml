# Local Postgres for development and tests.
# Production uses Supabase Postgres via DATABASE_URL (same code, same migrations).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cybertrace
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cybertrace"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
